<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/Portfolio logo.png" type="image/x-icon" />
    <title>Finance Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

<div class="dashboard-container">
    <h1>Personal Finance Tracker</h1>

    <div id="transactionsForm" class="transaction-form" aria-label="Add a new transaction">
        <div class="field-group">
            <label for="descriptionInput" class="sr-only">Transaction description</label>
            <input type="text" placeholder="Enter description..." id="descriptionInput" class="app-input" aria-label="Transaction description" />
        </div>

        <div class="field-group">
            <label for="amountInput" class="sr-only">Transaction amount</label>
            <input type="number" step="0.01" placeholder="Enter amount..." id="amountInput" class="app-input" aria-label="Transaction amount" />
        </div>

        <div class="field-group select-wrapper">
            <label for="categorySelect" class="sr-only">Transaction category</label>
            <select id="categorySelect" class="app-select" aria-label="Transaction category">
                <option value="" disabled selected hidden>Select category...</option>
                <option value="Food">Food</option>
                <option value="Income">Income</option>
                <option value="Rent">Rent</option>
                <option value="Utilities">Utilities</option>
                <option value="Shopping">Shopping</option>
            </select>
            <i class="fa-solid fa-chevron-down select-icon" aria-hidden="true"></i>
        </div>

        <button id="addTransactionBtn" class="app-btn" type="button" aria-label="Add transaction">
            <span class="sr-only">Add transaction</span>
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
        </button>
    </div>

    <div id="formStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <div class="stats-row">
        <div class="stat-card box-balance">
            <span class="label">Net Balance</span>
            <div id="netBalance" class="value">€0.00</div>
        </div>
        <div class="stat-card box-income">
            <span class="label">Total Income</span>
            <div id="totalIncome" class="value">€0.00</div>
        </div>
        <div class="stat-card box-expenses">
            <span class="label">Total Expenses</span>
            <div id="totalExpenses" class="value">€0.00</div>
        </div>
    </div>

    <div class="chart-card" aria-labelledby="expenseDistributionHeading" aria-describedby="expenseDistributionSummary">
        <h2 id="expenseDistributionHeading">Expense Distribution Breakdown</h2>
        <p id="expenseDistributionSummary" class="sr-only">Expense totals are shown as percentages for each category.</p>

        <div id="expenseChart" class="progress-track" role="img" aria-label="Expense distribution chart: Food 0%, Utilities 0%, Shopping 0%, Rent 0%">
            <div id="barFood" class="bar-segment color-food" style="width: 0%" aria-hidden="true"></div>
            <div id="barUtilities" class="bar-segment color-utilities" style="width: 0%" aria-hidden="true"></div>
            <div id="barShopping" class="bar-segment color-shopping" style="width: 0%" aria-hidden="true"></div>
            <div id="barRent" class="bar-segment color-rent" style="width: 0%" aria-hidden="true"></div>
        </div>

        <div class="chart-legend">
            <div class="legend-item">
                <span class="indicator color-food"></span>
                Food: <strong id="pctFood">0%</strong>
            </div>
            <div class="legend-item">
                <span class="indicator color-utilities"></span>
                Utilities: <strong id="pctUtilities">0%</strong>
            </div>
            <div class="legend-item">
                <span class="indicator color-shopping"></span>
                Shopping: <strong id="pctShopping">0%</strong>
            </div>
            <div class="legend-item">
                <span class="indicator color-rent"></span>
                Rent: <strong id="pctRent">0%</strong>
            </div>
        </div>
    </div>

    <div class="main-workspace">
        <div class="ledger-section" data-empty="false">
            <h2>Transaction Log</h2>

            <div id="filterToolbar" class="filter-toolbar" aria-label="Transaction filters">
                <div class="search-wrapper">
                    <label for="searchInput" class="sr-only">Search by transaction description</label>
                    <input type="text" placeholder="Search description..." id="searchInput" class="app-input" aria-label="Search by transaction description" />
                    <button type="button" id="deleteSearchBtn" class="delete-btn" aria-label="Clear search description">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="filter-tabs" role="group" aria-label="Filter transactions by category">
                    <button type="button" class="tab-btn active" data-filter="All" aria-pressed="true">All</button>
                    <button type="button" class="tab-btn" data-filter="Income" aria-pressed="false">Income</button>
                    <button type="button" class="tab-btn" data-filter="Utilities" aria-pressed="false">Utilities</button>
                    <button type="button" class="tab-btn" data-filter="Shopping" aria-pressed="false">Shopping</button>
                    <button type="button" class="tab-btn" data-filter="Food" aria-pressed="false">Food</button>
                    <button type="button" class="tab-btn" data-filter="Rent" aria-pressed="false">Rent</button>
                </div>
            </div>

            <div class="no-transaction-container" role="status" aria-live="polite" aria-atomic="true">
                <p id="noTransactionFound"></p>
                <button id="clearFilters" type="button" class="app-btn" aria-label="Clear all filters">
                    <span>Clear filters</span>
                    <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                </button>
            </div>

            <ul class="data-list">
                <li class="li-headers">
                    <span class="transaction-description">Description</span>
                    <span class="transaction-amount">Amount</span>
                    <span class="transaction-category">Category</span>
                </li>
            </ul>

            <ul id="transactionList" class="data-list"></ul>
        </div>

        <div class="sidebar-section">
            <h2>Food Log</h2>
            <ul id="foodList" class="data-list food-list"></ul>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
