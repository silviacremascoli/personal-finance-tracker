<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/Portfolio logo.png" type="image/x-icon" />
    <title>Finance Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

<div class="dashboard-container">
    <h1>Personal Finance Tracker</h1>

    <div id="transactionsForm" class="transaction-form">
        <label aria-label="Enter transaction description" for="descriptionInput"></label>
        <input type="text" placeholder="Enter description..." id="descriptionInput" class="app-input" />
        <label aria-label="Enter transaction amount" for="amountInput"></label>
        <input type="number" step="0.01" placeholder="Enter amount..." id="amountInput" class="app-input" />

        <label for="categorySelect"></label>
        <div class="select-wrapper">
            <select id="categorySelect" class="app-select" aria-label="Select transaction category">
                <option value="" disabled selected hidden>Select category...</option>
                <option value="Food">Food</option>
                <option value="Income">Income</option>
                <option value="Rent">Rent</option>
                <option value="Utilities">Utilities</option>
                <option value="Shopping">Shopping</option>
            </select>
            <i class="fa-solid fa-chevron-down select-icon"></i>
        </div>

        <button id="addTransactionBtn" class="app-btn" aria-label="Add transaction">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <div class="stats-row">
        <div class="stat-card box-balance">
            <span class="label">Net Balance</span>
            <div id="netBalance" class="value">€0.00</div>
        </div>
        <div class="stat-card box-income">
            <span class="label">Total Income</span>
            <div id="totalIncome" class="value">€0.00</div>
        </div>
        <div class="stat-card box-expenses">
            <span class="label">Total Expenses</span>
            <div id="totalExpenses" class="value">€0.00</div>
        </div>
    </div>

    <div class="chart-card">
        <h2>Expense Distribution Breakdown</h2>

        <div class="progress-track">
            <div id="barFood" class="bar-segment color-food" style="width: 0%"></div>
            <div id="barUtilities" class="bar-segment color-utilities" style="width: 0%"></div>
            <div id="barShopping" class="bar-segment color-shopping" style="width: 0%"></div>
            <div id="barRent" class="bar-segment color-rent" style="width: 0%"></div>
        </div>

        <div class="chart-legend">
            <div class="legend-item">
                <span class="indicator color-food"></span>
                Food: <strong id="pctFood">0%</strong>
            </div>
            <div class="legend-item">
                <span class="indicator color-utilities"></span>
                Utilities: <strong id="pctUtilities">0%</strong>
            </div>
            <div class="legend-item">
                <span class="indicator color-shopping"></span>
                Shopping: <strong id="pctShopping">0%</strong>
            </div>
            <div class="legend-item">
                <span class="indicator color-rent"></span>
                Rent: <strong id="pctRent">0%</strong>
            </div>
        </div>
    </div>

    <div class="main-workspace">
        <div class="ledger-section" data-empty="false">
            <h2>Transaction Log</h2>

            <div id="filterToolbar" class="filter-toolbar">
                <div class="search-wrapper">
                    <label for="searchInput"></label>
                    <input type="text" placeholder="Search description..." id="searchInput" class="app-input" />
                    <button type="button" id="deleteSearchBtn" class="delete-btn" aria-label="Clear search description">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="filter-tabs">
                    <button class="tab-btn active" data-filter="All">All</button>
                    <button class="tab-btn" data-filter="Income">Income</button>
                    <button class="tab-btn" data-filter="Utilities">Utilities</button>
                    <button class="tab-btn" data-filter="Shopping">Shopping</button>
                    <button class="tab-btn" data-filter="Food">Food</button>
                    <button class="tab-btn" data-filter="Rent">Rent</button>
                </div>
            </div>

            <div class="no-transaction-container">
                <p id="noTransactionFound"></p>
                <button id="clearFilters" class="app-btn">
                    <span>Clear filters</span>
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>

            <ul class="data-list">
                <li class="li-headers">
                    <span class="transaction-description">Description</span>
                    <span class="transaction-amount">Amount</span>
                    <span class="transaction-category">Category</span>
                </li>
            </ul>

            <ul id="transactionList" class="data-list"></ul>
        </div>

        <div class="sidebar-section">
            <h2>Food Log</h2>
            <ul id="foodList" class="data-list food-list"></ul>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
